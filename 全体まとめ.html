<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>標準化移行作業の全体像 ― 令和9年度の切替に向けたフロー整理とツール化の計画</title>
<style>
  .viz-root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --sunken: #f3f2ee;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s1-soft: #e3eefb; --s2-soft: #fde9e0; --s3-soft: #def4ea;
    --todo: #c4302b; --today: #e34948; --band: rgba(137,135,129,0.10);
    --on-bar: #0b0b0b;
    /* イベントの区分の色（切替・バージョンアップ・その他・窓口ソリューション） */
    --g1: #7b5bd6; --g2: #b8860b; --g3: #898781; --g4: #d1478f;
    --g1-soft: #ece7fb; --g2-soft: #f6ecd2; --g3-soft: #ecebe7; --g4-soft: #fbe3ef;
    /* エラーが出たときの色（要確認の赤・自チーム以外のオレンジと見分ける） */
    --err: #e8b400;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --sunken: #222220;
      --ink: #ffffff; --ink-2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s1-soft: #1c2a3d; --s2-soft: #3a2219; --s3-soft: #15302a;
      --todo: #e66767; --today: #e66767; --band: rgba(195,194,183,0.08);
      --g1: #9a7ff0; --g2: #c9971f; --g3: #898781; --g4: #e0659f;
      --g1-soft: #2a2340; --g2-soft: #33290f; --g3-soft: #262624; --g4-soft: #3a1f2d;
      --err: #f0c419;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --sunken: #222220;
    --ink: #ffffff; --ink-2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s1-soft: #1c2a3d; --s2-soft: #3a2219; --s3-soft: #15302a;
    --todo: #e66767; --today: #e66767; --band: rgba(195,194,183,0.08);
    --g1: #9a7ff0; --g2: #c9971f; --g3: #898781; --g4: #e0659f;
    --g1-soft: #2a2340; --g2-soft: #33290f; --g3-soft: #262624; --g4-soft: #3a1f2d;
    --err: #f0c419;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif;
    font-size: 13px; line-height: 1.5; min-height: 100vh;
  }
  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header h1 .subtitle { font-size: 13px; font-weight: 400; color: var(--ink-2); }
  header nav { display: flex; gap: 14px; flex-wrap: wrap; }
  header nav a { color: var(--ink-2); text-decoration: none; }
  header nav a:hover { color: var(--ink); text-decoration: underline; }
  main { padding: 16px 24px 48px; max-width: 1400px; }
  section { margin: 0 0 28px; scroll-margin-top: 56px; }
  section > h2 { font-size: 15px; margin: 0 0 8px; padding-left: 8px; border-left: 4px solid var(--s1); }
  .fig { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .fig + .fig { margin-top: 12px; }
  .fig-title { font-weight: 700; margin: 0 0 10px; }
  .guide { font-weight: 400; font-size: 12px; margin-left: 12px; color: var(--s1); }
  .muted { color: var(--muted); }
  .todo { color: var(--todo); font-weight: 600; white-space: nowrap; }

  /* 1. 目的 */
  .goal { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 10px; }
  .goal > div { background: var(--sunken); border-radius: 8px; padding: 10px 12px; }
  .goal .main { background: var(--s1-soft); }
  .goal b { display: block; margin-bottom: 4px; }
  .goal .end { grid-column: 1 / -1; background: var(--s2-soft); font-weight: 600; }

  /* 2. 枠組み */
  .frame { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .frame-col { background: var(--sunken); border-radius: 8px; padding: 10px; }
  .frame-col h3 { font-size: 13px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 6px; }
  .state { font-size: 11px; font-weight: 600; border-radius: 10px; padding: 0 8px; white-space: nowrap; }
  .state.done { background: var(--s3-soft); color: var(--ink); border: 1px solid var(--s3); }
  .state.yet { background: var(--surface); color: var(--ink-2); border: 1px solid var(--axis); }
  .ev { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; }
  .ev b { display: block; }
  .ev span { color: var(--ink-2); font-size: 12px; }
  .ev a { color: inherit; text-decoration: none; }
  .ev a:hover b { text-decoration: underline; }
  .g1 { --g: var(--g1); --g-soft: var(--g1-soft); }
  .g2 { --g: var(--g2); --g-soft: var(--g2-soft); }
  .g3 { --g: var(--g3); --g-soft: var(--g3-soft); }
  .g4 { --g: var(--g4); --g-soft: var(--g4-soft); }
  .frame-col.grouped { background: var(--g-soft); border-top: 4px solid var(--g); }
  .group { background: var(--g-soft); border: 2px solid var(--g); border-radius: 12px; padding: 10px 12px 12px; }
  .group + .group { margin-top: 16px; }
  .group-h { display: inline-block; font-size: 12px; font-weight: 700; background: var(--surface); border: 1px solid var(--g); border-radius: 10px; padding: 0 10px; margin: 0 0 8px; }
  .group .fig > .fig-title { font-size: 17px; line-height: 1.3; padding-left: 10px; border-left: 5px solid var(--g); }
  .frame-note { margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }

  /* 3. 切替の流れ */
  .loop-wrap { display: grid; grid-template-columns: 560px 1fr; gap: 14px; align-items: start; }
  svg text { font-family: inherit; }
  .stage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stage > div { border-radius: 8px; padding: 8px 10px; background: var(--sunken); }
  .stage .who { font-size: 11px; font-weight: 600; }
  .arrow-row { color: var(--muted); text-align: center; }

  /* 4. フロー */
  .flow { display: grid; gap: 10px; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; }
  .phase { background: var(--sunken); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .phase-h { font-weight: 700; font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; }
  .step { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--axis); border-radius: 6px; padding: 6px 8px; position: relative; }
  .step.own { border-left-color: var(--s1); }
  .step.leader { border-left-color: var(--s1); background: var(--s1-soft); }
  .step.outer { border-left-color: var(--s2); }
  .step.err { border-left-color: var(--err); }
  .step .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step .t { font-weight: 700; display: block; }
  .step .when { font-size: 11px; color: var(--ink-2); }
  .step .who { font-size: 11px; display: inline-block; border-radius: 10px; padding: 0 6px; margin-top: 2px; border: 1px solid var(--axis); color: var(--ink-2); }
  .step .done { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .step .ai { position: absolute; top: 6px; right: 6px; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: var(--s3); color: var(--on-bar); }
  .step .ai.cand { background: var(--surface); color: var(--ink); border: 1.5px solid var(--s3); padding: 0 4px; }
  .step { cursor: pointer; }
  .step:hover { outline: 1px dashed var(--s3); outline-offset: 1px; }
  .step.ai-changed { outline: 2px dashed var(--s3); outline-offset: 1px; }
  .step .ai-what { font-size: 12px; margin-top: 4px; padding-top: 3px; border-top: 1px dotted var(--s3); }
  .ai-guide { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--s1); }
  .ai-review { font-size: 11px; margin-top: 3px; color: var(--ink-2); }
  .ai-review .v { font-weight: 700; border-radius: 8px; padding: 0 6px; margin-right: 4px; border: 1px solid var(--s3); color: var(--ink); }
  .ai-review.ask .v { border-color: var(--todo); color: var(--todo); }
  .ai-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: -4px 0 12px; }
  .ai-bar button { font: inherit; font-size: 12px; padding: 1px 10px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); cursor: pointer; }
  .ai-out { flex-basis: 100%; font: inherit; font-size: 12px; padding: 6px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); }
  .step + .step::before { content: "↓"; position: absolute; top: -13px; left: 10px; color: var(--muted); font-size: 11px; }
  .rule { background: var(--surface); border: 1px dashed var(--axis); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .rule ol, .rule ul { margin: 2px 0 0; padding-left: 18px; }
  .flow-lead { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border-radius: 12px; padding: 2px 10px; font-size: 12px; background: var(--sunken); color: var(--ink-2); }
  .chip.key { background: var(--s2-soft); color: var(--ink); font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
  /* 凡例の見本は、作業の枠（.step）と同じ見た目にする */
  .legend i { display: inline-block; width: 20px; height: 13px; border: 1px solid var(--border); border-left: 4px solid var(--axis); border-radius: 3px; background: var(--surface); vertical-align: -2px; margin-right: 5px; }
  .legend i.own { border-left-color: var(--s1); }
  .legend i.leader { border-left-color: var(--s1); background: var(--s1-soft); }
  .legend i.outer { border-left-color: var(--s2); }
  .legend i.err { border-left-color: var(--err); }
  .legend .ai-b { font-size: 10px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: var(--s3); color: var(--on-bar); margin-right: 5px; }
  .legend .ai-b.cand { background: var(--surface); color: var(--ink); border: 1.5px solid var(--s3); padding: 0 4px; }

  /* 5. AI */
  .ai-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ai-card { border-radius: 8px; padding: 8px 10px; background: var(--sunken); }
  .ai-card .lv { font-size: 11px; font-weight: 700; border-radius: 10px; padding: 0 8px; display: inline-block; margin-bottom: 4px; }
  .lv.fixed { background: var(--s3); color: var(--on-bar); }
  .lv.strong { background: var(--s1); color: var(--on-bar); }
  .lv.cand { background: var(--surface); border: 1px solid var(--axis); color: var(--ink-2); }
  .lv.aicand { background: var(--surface); border: 1.5px solid var(--s3); color: var(--ink); }
  .ai-card b { display: block; }
  .ai-card .where { font-size: 11px; color: var(--muted); }
  .ai-card .what { font-size: 12px; color: var(--ink-2); }
  .no-ai { margin-top: 10px; font-size: 12px; color: var(--ink-2); }

  /* 6. マイルストーン */
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lane-label { fill: var(--ink); font-size: 12px; }
  .gridline { stroke: var(--grid); }
  .bar-label { fill: var(--on-bar); font-size: 11px; }
  .bar-label.out { fill: var(--ink); }
  .ms-label { fill: var(--ink); font-size: 11px; font-weight: 700; }
  .ms-name { fill: var(--ink-2); font-size: 10px; }
  .open { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .open > div { background: var(--sunken); border-radius: 8px; padding: 8px 10px; }
  .open b { display: block; margin-bottom: 4px; }
  .open ul { margin: 0; padding-left: 18px; font-size: 12px; color: var(--ink-2); }

  @media (max-width: 1000px) {
    .goal, .frame, .ai-grid, .open { grid-template-columns: 1fr 1fr; }
    .loop-wrap { grid-template-columns: 1fr; }
  }
  @media print { header { position: static; } .flow { grid-auto-flow: row; } .ai-bar { display: none; } .step.ai-changed { outline: none; } }
</style>
</head>
<body>
<div class="viz-root">
<header>
  <h1>標準化移行作業の全体像 <span class="subtitle">― 令和9年度の切替に向けたフロー整理とツール化の計画</span></h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
</div>

<script>
(function () {
  "use strict";

  // =====================================================================
  // データ（全体像はこの1枚だけで管理する）
  // who: 役割。own=自チーム、leader=現場リーダー等、outer=自チーム以外
  // ai: AIを使うところ（fixed=決定、cand=案）  aiWhat: AIに何をさせるか  aiGuide: 詳しい使い方の型（AIの使い方の型.md）  aiReview: 案の見立て（keep=残す、ask=要相談）  todo: 要確認
  // =====================================================================

  var GOAL = {
    main: "令和9年度に集中する34団体の切替を、要員が減ったり入れ替わったりしても、品質を落とさずにやり遂げられる体制を整える。そのために作業を見える化してフローに整理し、フローをもとにしたツールで、特定の人に頼っている作業を減らす。",
    uses: [
      ["新しく加わる人が全体像をつかめる", "来年度の作業者に展開する資料として使う。短い期間で、作業の流れと自分の受け持ちがわかるようにする。"],
      ["リーダーの割り振りの負担を減らす", "毎週、イベントをタスクに分けるときの型として使う。誰がリーダーでも、同じ粒度で割り振れるようにする。"],
      ["自動化の土台にする", "ツールを設計するときのもとにする。フローのどこを道具で置き換えるかを、ここから決める。"]
    ],
    end: "完了の条件：令和9年度の最初のリハーサルで、引き継いだ人がフローとツールを使って作業を回せたこと。ツールができた時点や、使い始めた時点では完了としない。"
  };

  var FRAME = [
    { name: "切替", g: "g1", state: "done", events: [
      { id: "prep", name: "移行の準備", desc: "切替日から逆算して進める準備。あわせて、手順書・資産の随時の修正と、移行チームへの移管資産のリリースを行う" },
      { id: "run", name: "移行の実施", desc: "リハーサル・全体移行テスト・本番切替。当日は手順書どおりに進め、エラーが出たときは原因と影響の説明までを受け持つ" },
      { id: "verify", name: "移行結果の確認", desc: "自治体に出す移行結果報告資料を作るための、移行前後のデータ比較。R8年度中・R9年度の稼働直前・本番切替時の3段階で進める" }
    ] },
    { name: "バージョンアップ", g: "g2", state: "done", events: [
      { id: "vupre", name: "稼働前のバージョンアップ", desc: "検証面・開発環境などへの適用。リーダーが実施日を決め、そこから逆算して準備する" },
      { id: "vupost", name: "稼働後のバージョンアップ", desc: "本番環境への適用。受け入れ検証・稟議・市町村への作業申請を経てから適用する" }
    ] },
    { name: "その他", g: "g3", state: "yet", events: [
      { name: "総合テスト", desc: "業務システム全体の受け入れテスト。マスキングしたデータの取り込みを含む" },
      { name: "標準化関連の随時依頼", desc: "センターのブリーフィングで発生する、標準化関連の依頼への対応" },
      { name: "トラブル対応", desc: "イベントとしての整理はこれから。AIの使い方（トラブルシュートの型）は決まっている" }
    ] },
    { name: "窓口ソリューション", g: "g4", state: "yet", events: [
      { name: "（内容は後日ヒアリング）", desc: "8団体分のカスタマイズ・検証・導入" }
    ] }
  ];

  var FRAME_NOTES = [
    "イベントは、きっかけではなく「準備か、実施か」で区切る",
    "やることがほぼ同じものは1つのイベントにまとめ、違いだけを表に示す",
    "手順書・資産の直しはイベントにせず、「随時の修正」のルールで回す"
  ];

  var FLOWS = [
    { id: "prep", name: "移行の準備", guide: "各論/新人向け/説明_移行の準備.md",
      timeline: {
        cols: ["数か月前", "数週間前", "2週間前", "前日", "実施日"],
        rows: [
          { label: "A 切替日に向けて", items: [
            { at: 0, t: "A1 要員の割り当て", c: "leader" }, { at: 1, t: "A3 要員の確定", c: "leader" }, { at: 2, t: "A2 手順書・資産の確定" }, { at: 3, t: "A4 事前作業" }, { at: 4, t: "実施", c: "run" }] },
          { label: "C 移管資産", items: [
            { from: 0, to: 1.4, t: "C1 取りまとめ（本来は随時）", c: "dash" }, { from: 1.4, to: 2, t: "C2 テスト" }, { at: 2, t: "C3 リリース" },
            { from: 2, to: 4, t: "移行チームが一度通して実行", c: "outer" }] },
          { label: "B 随時の修正", items: [{ from: 0, to: 2, t: "移行チームに渡す資産", end: "締切" }] },
          { label: "", items: [{ from: 0, to: 3, t: "自チーム内の修正（手順書など）", end: "締切" }] }
        ] },
      lead: [["基準日", "切替日（リハーサル日・本番切替日）"], ["移管", "開発担当分の業務（住民記録・宛名管理・印鑑登録など）の移行ツールのうち、抽出工程の実施は移行チームに移管している"], ["key", "前回の課題が反映されているか、団体ごとの差分が織り込まれているかを、2週間前の確定の時点で確かめる"]],
      phases: [
        { name: "A. 切替日に向けて", steps: [
          { no: "A1", t: "要員の概算の割り当て", when: "数か月前", who: "リーダー", c: "leader", done: "団体ごとに、担当者の見込みが立っている" },
          { no: "A2", t: "手順書・資産の確定", when: "2週間前まで（C3 に合わせる）", who: "作業者（確認の観点はリーダーが伝える）", c: "own", done: "前回の課題を反映し、今回の団体向けの手順書・資産が確定している", ai: "cand", aiGuide: "E", aiWhat: "前回の課題・団体ごとの差分・手順書を添付し、どこに反映したかの対応表を返させる。見つからないものは未反映とさせる", aiReview: { v: "keep", why: "前回の課題・団体ごとの差分・手順書を渡せば、それだけで点検できる" } },
          { no: "A3", t: "要員の確定", when: "数週間前", who: "リーダー", c: "leader", done: "当日の要員・連絡先・現場リーダー等が決まっている" },
          { no: "A4", t: "事前作業（初期化・資産の格納・手順書の印刷）", when: "前日", who: "作業者", c: "own", done: "事前作業の手順がすべて済んでいる" }
